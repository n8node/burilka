services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./acme-webroot:/var/www/certbot:ro
      - ./letsencrypt:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: https://burilka.com
      INTERNAL_API_URL: http://backend:8080
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  worker:
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  wordpress:
    environment:
      APP_SCHEME: https
      APP_DOMAIN: burilka.com
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'https://burilka.com');
        define('WP_SITEURL', 'https://burilka.com');
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && strpos($$_SERVER['HTTP_X_FORWARDED_PROTO'], 'https') !== false) { $$_SERVER['HTTPS'] = 'on'; }
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mysql:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  wordpress-cli:
    environment:
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:?Set WP_ADMIN_PASSWORD in the protected .env file}
      APP_DOMAIN: burilka.com

  migrate:
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable