resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name burilka.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name burilka.com;

    ssl_certificate /etc/letsencrypt/live/burilka.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/burilka.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /app/health {
        proxy_pass http://backend:8080/health;
        include /etc/nginx/snippets/proxy-common.conf;
    }

    location ^~ /app/api/ {
        proxy_pass http://backend:8080/api/;
        include /etc/nginx/snippets/proxy-common.conf;
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    location ^~ /app/_next/static/ {
        proxy_pass http://frontend:3000/app/_next/static/;
        include /etc/nginx/snippets/proxy-common.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /app/ {
        proxy_pass http://frontend:3000;
        include /etc/nginx/snippets/proxy-common.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /app { return 308 /app/; }

    location ~ ^/(wp-admin|wp-content|wp-includes|wp-json|wp-login\.php|xmlrpc\.php|wp-cron\.php) {
        proxy_pass http://wordpress:80;
        include /etc/nginx/snippets/proxy-common.conf;
        client_max_body_size 64m;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://wordpress:80;
        include /etc/nginx/snippets/proxy-common.conf;
        client_max_body_size 64m;
        proxy_read_timeout 300s;
    }
}